name: Quality and publish stable packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install rclone
        run: |
          curl --fail --location --output /tmp/rclone.deb https://downloads.rclone.org/v1.74.3/rclone-v1.74.3-linux-amd64.deb
          echo "408cde598307dedc26b7108553cb2147a8d2d12853100447e802f47454582ecc  /tmp/rclone.deb" | sha256sum --check --strict
          sudo dpkg --install /tmp/rclone.deb
          rclone version
      - name: Type-check
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
      - name: Build release packages
        run: pnpm release:build
      - name: Validate release packages
        run: pnpm release:check

  sonarqube:
    name: SonarQube
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Read project version
        id: project
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.project.outputs.version }}
            -Dsonar.qualitygate.wait=true

  publish:
    name: Publish stable packages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs:
      - quality
      - sonarqube
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release packages
        run: pnpm release:build
      - name: Check published versions
        id: published
        run: node scripts/check-published.mjs >> "$GITHUB_OUTPUT"
      - name: Publish state service
        if: steps.published.outputs.state != 'true'
        run: pnpm run release:publish -- dsh-roleplay-state
      - name: Publish core plugin
        if: steps.published.outputs.core != 'true'
        run: pnpm run release:publish -- dsh-agentic-roleplay-core
      - name: Publish complete bundle
        if: steps.published.outputs.all != 'true'
        run: pnpm run release:publish -- dsh-agentic-roleplay
