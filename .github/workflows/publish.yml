name: Publish tagged releases

# Publishing is a tagged act, not a consequence of pushing to main: a push to main is built and analysed by
# `code-analysis.yml`, and nothing is uploaded. Pushing a `v<version>` tag runs the build again as a release gate and
# then publishes. This workflow deliberately does not look at the SonarQube verdict — if a tag names a version whose
# artifacts build and pass `release:check`, it publishes, because tagging is the maintainer's decision. The SonarQube
# gate lives in `code-analysis.yml`, on the commit the tag points at.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install rclone
        run: |
          curl --fail --location --output /tmp/rclone.deb https://downloads.rclone.org/v1.74.3/rclone-v1.74.3-linux-amd64.deb
          echo "408cde598307dedc26b7108553cb2147a8d2d12853100447e802f47454582ecc  /tmp/rclone.deb" | sha256sum --check --strict
          sudo dpkg --install /tmp/rclone.deb
          rclone version
      - name: Type-check
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Build release packages
        run: pnpm release:build
      - name: Validate release packages
        run: pnpm release:check

  publish:
    name: Publish stable packages
    # `workflow_dispatch` can be fired on a branch, so the tag guard is repeated here.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Check the tag matches the shipped version
        # A tag pushed onto a commit already bumped to a newer version would otherwise publish that newer version
        # under the older tag. Fail instead of guessing.
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version v${version}; refusing to publish"
            exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release packages
        run: pnpm release:build
      - name: Check published versions
        id: published
        run: node scripts/check-published.mjs >> "$GITHUB_OUTPUT"
      - name: Publish state service
        if: steps.published.outputs.state != 'true'
        run: pnpm run release:publish -- dsh-roleplay-state
      - name: Publish core plugin
        if: steps.published.outputs.core != 'true'
        run: pnpm run release:publish -- dsh-agentic-roleplay-core
      - name: Publish complete bundle
        if: steps.published.outputs.all != 'true'
        run: pnpm run release:publish -- dsh-agentic-roleplay
