# One row per plugin in the bundle. The core row id is the settings form id
# and must match ENTRY_ID in the core package.
- insert:
    - id: roleplay-state
      name: '@dsh-agentic-roleplay/state'
    - id: roleplay
      name: '@dsh-agentic-roleplay/core'
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: speech-to-text-sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
    - id: api-speech-to-text
      name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
    - id: ui-voice-input
      name: '@deepseek-ai/dsh-experimental-client-ui-voice-input'
    # The agent preset roleplay chats run under; its id must match AGENT_PRESET
    # in the core package. It mounts no agent tools: the orchestration plugin
    # brings the game master's own tools, hooks and instructions.
    - id: preset-roleplay
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: roleplay
        name: Role Play
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: ''
          - id: orchestration
            name: '@dsh-agentic-roleplay/core/orchestration'
          # Folds the oldest turns of a long conversation into summaries written
          # from the story's recorded events, at the limit set per chat.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: roleplay-compaction
                name: '@dsh-agentic-roleplay/core/compaction'
    # This first authoring preset deliberately mounts only its persona and
    # therefore cannot inherit the stock agent's filesystem tools.
    - id: preset-world-authoring
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: world-authoring
        name: World Authoring
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: ''
          - id: authoring
            name: '@dsh-agentic-roleplay/core/authoring'
