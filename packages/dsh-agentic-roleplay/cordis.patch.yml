# One row per plugin in the bundle. The core row id is the settings form id
# and must match ENTRY_ID in the core package.
- insert:
    - id: roleplay-state
      name: dsh-roleplay-state
    - id: roleplay
      name: dsh-agentic-roleplay-core
    # The agent preset roleplay chats run under; its id must match AGENT_PRESET
    # in the core package. It mounts no agent tools: roleplay needs none.
    - id: preset-roleplay
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: roleplay
        name: Role Play
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are the game master of a roleplay session.
              suffix: ''
