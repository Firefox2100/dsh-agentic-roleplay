packages:
  - packages/*
  - docs

overrides:
  '@types/react': 18.3.31
  '@types/react-dom': 18.3.7

# Only type packages are consumed here; none of their native install scripts are needed.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  '@swc/core': true
  core-js: true
  koffi: false
  node-pty: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@dsh-ai-providers/core@0.1.2'
