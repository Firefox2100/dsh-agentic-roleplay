packages:
  - packages/*

# Only type packages are consumed here; none of their native install scripts are needed.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  '@swc/core': set this to true or false
  core-js: set this to true or false
  koffi: false
  node-pty: false
  protobufjs: false
